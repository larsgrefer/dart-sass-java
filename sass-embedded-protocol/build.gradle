plugins {
    id "com.google.protobuf" version "0.9.5"
    id "io.freefair.maven-publish-java"
    id "io.freefair.lombok"
    id "idea"
    id "java-library"
    id "sass.deprecations"
}

description = "SASS Embedded Protocol"

publishing.publications.mavenJava.pom.description = "Java DTOs for the embedded-sass-protocol"

repositories {
    ivy {
        //https://github.com/sass/sass/archive/refs/tags/embedded-protocol-1.2.0.zip
        artifactPattern "https://github.com/[orgPath]/[orgPath]/archive/[artifact]-[revision].[ext]"
        metadataSources {
            artifact()
        }
    }
    ivy {
        // https://raw.githubusercontent.com/sass/sass/refs/heads/main/spec/deprecations.yaml
        artifactPattern "https://raw.githubusercontent.com/[orgPath]/[orgPath]/refs/tags/embedded-protocol-[revision]/spec/[artifact].[ext]"
        metadataSources {
            artifact()
        }
    }
}

def protobufVersion = "4.36.2"

tasks.withType(com.google.protobuf.gradle.ProtobufExtract).configureEach {
    doFirst {
        project.delete destDir
    }
}

dependencies {
    protobuf "sass:embedded-protocol:$embeddedProtocolVersion@zip"

    api "com.google.protobuf:protobuf-java:$protobufVersion"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:$protobufVersion"
    }
}

tasks.named("jar", Jar) {
    manifest {
        attributes 'Specification-Vendor': "Google LLC",
                'Specification-Version': "$embeddedProtocolVersion"
    }
}
