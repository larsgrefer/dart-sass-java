plugins {
    id "io.freefair.git-version"
    id "io.freefair.lombok" apply false
    id "io.freefair.javadocs" apply false
    id "base"
    id 'org.jreleaser' version '1.20.0'
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }

    group = "de.larsgrefer.sass"

    plugins.withId("java") {

        project.apply plugin: "io.freefair.javadocs"

        java {
            withSourcesJar()
            withJavadocJar()
            toolchain {
                languageVersion = JavaLanguageVersion.of(8)
            }
        }

        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs += "-parameters"
        }

        tasks.withType(Javadoc).configureEach {
            options.addBooleanOption("Xdoclint:-missing", true)
            failOnError = false
        }

        dependencies {
            testImplementation 'org.assertj:assertj-core:3.26.3'

            testImplementation platform("org.junit:junit-bom:5.13.4")
            testImplementation 'org.junit.jupiter:junit-jupiter-api'
            testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

            testImplementation 'ch.qos.logback:logback-classic:1.5.18'
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                exceptionFormat = "full"
                showExceptions = true
                showCauses = true
                showStackTraces = true
                showStandardStreams = System.getenv("CI") == "true"
            }
        }

        afterEvaluate {
            tasks.named("jar", Jar) {
                manifest {
                    attributes 'Implementation-Title': "$project.description",
                            'Implementation-Version': "$project.version",
                            'Implementation-URL': "https://github.com/larsgrefer/dart-sass-java"
                }
            }
        }
    }

    plugins.withId("jacoco") {
        tasks.withType(JacocoReport).configureEach {
            reports.xml.required = true
        }
    }

    plugins.withId("maven-publish") {

        project.apply plugin: "io.freefair.maven-central.validate-poms"
        project.apply plugin: "signing"

        signing {
            required = { !version.endsWith('SNAPSHOT') && gradle.taskGraph.hasTask("publish") }

            def signingKey = findProperty("signingKey")
            def signingPassword = findProperty("signingPassword")
            useInMemoryPgpKeys(signingKey, signingPassword)
        }

        publishing {
            publications.withType(MavenPublication) {
                pom {
                    url = 'https://github.com/larsgrefer/dart-sass-java/'
                    name = provider { project.description }
                    description = provider { project.description }
                    inceptionYear = '2021'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    developers {
                        developer {
                            id = 'larsgrefer'
                            name = 'Lars Grefer'
                            email = 'github@larsgrefer.de'
                            timezone = 'Europe/Berlin'
                        }
                    }
                    ciManagement {
                        system = 'GitHub Actions'
                        url = 'https://github.com/larsgrefer/dart-sass-java/actions'
                    }
                    issueManagement {
                        system = 'GitHub'
                        url = 'https://github.com/larsgrefer/dart-sass-java/issues'
                    }
                    scm {
                        connection = 'scm:git:https://github.com/larsgrefer/dart-sass-java.git'
                        developerConnection = 'scm:git:git@github.com:larsgrefer/dart-sass-java.git'
                        url = 'https://github.com/larsgrefer/dart-sass-java/'
                    }
                }
            }

            repositories {
                maven {
                    name = "mavenCentralStaging"
                    url = rootProject.layout.buildDirectory.dir('staging-deploy')
                }
            }
        }

    }
}

jreleaser {
    project {
        license = 'MIT'
        inceptionYear = '2021'
    }
    signing {
        active = 'NEVER'
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    namespace = "de.larsgrefer"
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    sign = false //Already done by Gradle
                    checksums = false //Already done by Gradle
                    stagingRepository('build/staging-deploy')
                    verifyPom = false // https://github.com/jreleaser/jreleaser.github.io/issues/85
                }
            }
        }
    }
}
